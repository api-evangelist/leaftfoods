generated: '2026-07-19'
method: searched
source: https://www.leaftfoods.com/.well-known/ucp
name: Leaft Foods UCP MCP Server
description: Leaft Foods runs a live, publicly addressable MCP server as part of its Shopify-native
  Universal Commerce Protocol (UCP) implementation. Agents discover it from /.well-known/ucp and call it
  over JSON-RPC to search the catalog, build a cart, and drive a checkout to completion. Payment completion
  requires contemporaneous buyer approval.
status: published
status_raw: live
transport: mcp
endpoint: https://www.leaftfoods.com/api/ucp/mcp
canonical_endpoint: https://leaft-foods.myshopify.com/api/ucp/mcp
protocol: jsonrpc-2.0
method_http: POST
content_type: application/json
discovery:
  well_known: https://www.leaftfoods.com/.well-known/ucp
  agent_instructions: https://www.leaftfoods.com/llms.txt
  openrpc_schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  specification: https://ucp.dev/2026-04-08/specification/overview/
versions:
  latest: '2026-04-08'
  supported:
  - version: '2026-04-08'
    profile: https://leaft-foods.myshopify.com/.well-known/ucp/2026-04-08
  - version: '2026-01-23'
    profile: https://leaft-foods.myshopify.com/.well-known/ucp/2026-01-23
probe:
  date: '2026-07-19'
  request: 'POST /api/ucp/mcp {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
  status: 422
  response_code: -32001
  response_message: UCP discovery failed
  response_data_code: invalid_profile_url
  note: The endpoint is live and returns a structured UCP JSON-RPC error. An unauthenticated tools/list is
