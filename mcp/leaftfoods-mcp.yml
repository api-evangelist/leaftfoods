    named tools documented in the store's own llms.txt plus the UCP capabilities declared in
    /.well-known/ucp — not a captured tools/list response.
tools:
- name: search_catalog
  method: searched
  source: https://www.leaftfoods.com/llms.txt
  capability: dev.ucp.shopping.catalog.search
  description: Find products matching the buyer's intent.
- name: create_cart
  method: searched
  source: https://www.leaftfoods.com/llms.txt
  capability: dev.ucp.shopping.cart
  description: Add desired items to a cart.
- name: create_checkout
  method: searched
  source: https://www.leaftfoods.com/llms.txt
  capability: dev.ucp.shopping.checkout
  description: Start the purchase flow.
- name: update_checkout
  method: searched
  source: https://www.leaftfoods.com/llms.txt
  capability: dev.ucp.shopping.fulfillment
  description: Set shipping address and shipping method.
- name: complete_checkout
  method: searched
  source: https://www.leaftfoods.com/llms.txt
  capability: dev.ucp.shopping.checkout
  description: Finalize the purchase. Buyer must approve payment.
capabilities:
- id: dev.ucp.shopping.cart
  version: '2026-04-08'
- id: dev.ucp.shopping.checkout
  version: '2026-04-08'
- id: dev.ucp.shopping.fulfillment
  version: '2026-04-08'
  config:
    allows_multi_destination_shipping: false
    allows_method_combinations:
    - - shipping
- id: dev.ucp.shopping.discount
  version: '2026-04-08'
- id: dev.ucp.shopping.order
  version: '2026-04-08'
- id: dev.ucp.shopping.catalog.search
  version: '2026-04-08'
- id: dev.ucp.shopping.catalog.lookup
  version: '2026-04-08'
- id: dev.shopify.catalog
  version: '2026-04-08'
  spec: https://shopify.dev/docs/agents/catalog/storefront-catalog
payment_handlers:
- id: gpay
  family: com.google.pay
  version: '2026-01-11'
  gateway: shopify
  card_networks:
  - VISA
  - MASTERCARD
  - AMEX
  - DISCOVER
- id: shopify.card
  family: dev.shopify.card
  version: '2026-01-15'
  card_brands:
  - visa
  - master
  - american_express
  - discover
  - diners_club
rules:
- Checkout requires explicit, contemporaneous human approval before payment is completed.
- The MCP endpoint is rate-limited per IP; back off on 429 responses.
- Pass context.address_country and context.currency for accurate pricing and availability.
alternative:
  name: Shop skill
  url: https://shop.app/SKILL.md
  note: The store recommends personal-shopping agents install the cross-store Shop skill and transact via
    Shop Pay rather than scripting the storefront directly.
