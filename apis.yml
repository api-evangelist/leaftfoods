- aid: leaftfoods:leaftblade-ucp-commerce
  name: Leaft Blade Universal Commerce Protocol (UCP) API
  description: The agent-facing commerce API for leaftblade.com, the direct-to-consumer storefront for the
    Leaft Blade protein beverage and a second Shopify shop operated by Leaft Foods (shop
    leaft-lightgrove.myshopify.com). It implements the same Universal Commerce Protocol surface as the
    corporate site — a merchant profile at /.well-known/ucp and an MCP endpoint for catalog, cart,
    checkout, fulfillment, discount and order — but unlike the corporate store it serves a live product
    catalog and additionally advertises Shop Pay as a payment handler. Agent instructions are published at
    both /llms.txt and /agents.md.
  humanURL: https://www.leaftblade.com/agents.md
