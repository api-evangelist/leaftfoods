apis:
- aid: leaftfoods:ucp-commerce
  name: Leaft Foods Universal Commerce Protocol (UCP) API
  description: The agent-facing commerce API for the Leaft Foods storefront. The store implements the
    Universal Commerce Protocol (ucp.dev) natively through Shopify, exposing a UCP merchant profile at
    /.well-known/ucp and an MCP endpoint at /api/ucp/mcp that agents use to search the catalog, create a
    cart, open and update a checkout, and complete a purchase. Completing payment requires contemporaneous
    buyer approval. Read-only storefront JSON (products, collections, search, cart) is available without
    authentication, and customer-account OAuth/OIDC is served from Shopify's authentication issuer.
  humanURL: https://www.leaftfoods.com/llms.txt
  baseURL: https://www.leaftfoods.com/api/ucp/mcp
