name: Leaft Foods
description: Leaft Foods is a New Zealand food-technology company, founded in 2019 by John Penno and Maury
  Leyland Penno and headquartered in Rolleston in the Selwyn district near Christchurch, that extracts Rubisco
  — the protein that drives photosynthesis and the most abundant protein on Earth — from green leafy crops
  such as lucerne. Its proprietary platform turns leaves into a neutral-tasting, highly digestible protein
  sold as the Leaft Blade consumer beverage, as a Rubisco protein isolate ingredient for food manufacturers,
  and as an Alfalfa Protein Concentrate for pet nutrition. The company raised a US$15M Series A led by Khosla
  Ventures. Its digital surface is a Shopify storefront that publishes a real agent-facing commerce API — a
  Universal Commerce Protocol (UCP) discovery document, an MCP endpoint for catalog, cart and checkout, an
  llms.txt / agents.md agent instruction set, and OpenID Connect discovery for customer accounts.
